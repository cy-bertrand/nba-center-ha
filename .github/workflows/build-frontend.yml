name: Build NBA Center frontend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'custom_components/nba_center/**'
      - 'package.json'
      - 'package-lock.json'
      - 'build.mjs'
  workflow_dispatch:

concurrency:
  group: nba-center-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Python syntax and tests
        run: |
          python -m compileall -q custom_components/nba_center
          python -m unittest discover -s tests -v
      - name: Build bundled Lit card
        run: |
          npm ci --no-audit --no-fund
          npm ls lit esbuild
          node --check frontend/src/nba-center-card.js
          npm run build
          npm test
      - name: Verify generated bundle is committed
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- custom_components/nba_center/www/nba-center-card.js
      - name: Commit generated frontend bundle
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- custom_components/nba_center/www/nba-center-card.js; then
            echo "Frontend bundle is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/nba_center/www/nba-center-card.js
          git commit -m "build(frontend): bundle NBA Center Lit card"
          git push origin "HEAD:${GITHUB_REF_NAME}"
